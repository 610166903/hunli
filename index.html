<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>婚礼邀请函</title>
    <link rel="preload" href="layer-6-mobile.mp4" as="video" type="video/mp4">
    <link rel="stylesheet" href="styles.css?v=20260813-scroll-scrub-v16">
  </head>
  <body>
    <button class="music-toggle" type="button" aria-label="播放音乐" aria-pressed="false">
      <span class="music-icon">♪</span>
    </button>
    <audio id="bgMusic" src="music.m4a" loop preload="auto"></audio>
    <main class="page">
      <div class="image-wrap">
        <img class="invitation" src="invitation-optimized.jpg" alt="婚礼邀请函" fetchpriority="high">
        <video
          class="intro-video"
          src="layer-6-mobile.mp4"
          poster="layer-6-mobile.mp4.png"
          muted
          playsinline
          webkit-playsinline
          preload="auto"
          aria-label="婚礼邀请函开场动画"
        >
          <source src="layer-6-mobile.mp4" type="video/mp4">
        </video>
        <img class="scroll-hint" src="scroll-hint.gif" alt="下滑查看" aria-hidden="true">
        <div class="intro-scrub-layer" aria-hidden="true"></div>
        <section class="album-slider" aria-label="左右滑动查看相册">
          <div class="album-track">
            <div class="album-art">
              <img class="album-strip" src="album-strip-optimized.png" alt="相册照片框" loading="lazy" decoding="async">
              <button class="album-photo-hit album-photo-hit-1" type="button" data-photo-index="0" aria-label="放大查看第1张照片"></button>
              <button class="album-photo-hit album-photo-hit-2" type="button" data-photo-index="1" aria-label="放大查看第2张照片"></button>
              <button class="album-photo-hit album-photo-hit-3" type="button" data-photo-index="2" aria-label="放大查看第3张照片"></button>
              <button class="album-photo-hit album-photo-hit-4" type="button" data-photo-index="3" aria-label="放大查看第4张照片"></button>
              <button class="album-photo-hit album-photo-hit-5" type="button" data-photo-index="4" aria-label="放大查看第5张照片"></button>
              <button class="album-photo-hit album-photo-hit-6" type="button" data-photo-index="5" aria-label="放大查看第6张照片"></button>
            </div>
          </div>
        </section>
        <a
          class="map-hotspot map-hotspot-baidu"
          href="https://map.baidu.com/mobile/webapp/place/detail/qt=inf&uid=pedbd5648549b0c105878dbd26e/act=read_share&vt=map&da_from=weixin&openna=1&sharegeo=13537494%2C3684024"
          target="_blank"
          rel="noopener"
          aria-label="打开百度地图导航地址"
        ></a>
        <a
          class="map-hotspot map-hotspot-amap"
          href="https://m.amap.com/poi/detail?src=app_share&userRelationToken=9f9da25296db11f1b59900163e0e71ec0&share_type=url&share_from=poi_poi&share_from_type=AJX&share_bizParams=%7B%22poiid%22%3A%22%22%2C%22trigger%22%3A%22click%22%2C%22is_rank%22%3A0%7D&share_lastClickSpm=amap.27854080.tipBar_RenderPOITipBar.shareBtn&share_bid=vohliogncj1lfvbb4s709r1ccd4m1755e6f9ba1&lnglat=121.60140708088872%2C31.560879566528993&name=惠东路360号"
          target="_blank"
          rel="noopener"
          aria-label="打开高德地图导航地址"
        ></a>
        <a class="phone-hotspot bride-phone" href="tel:16621173283" aria-label="拨打新娘联系电话"></a>
        <a class="phone-hotspot groom-phone" href="tel:18016028382" aria-label="拨打新郎联系电话"></a>
      </div>
    </main>
    <div class="photo-lightbox" aria-hidden="true" role="dialog" aria-label="照片预览">
      <button class="lightbox-close" type="button" aria-label="关闭照片预览">×</button>
      <button class="lightbox-nav lightbox-prev" type="button" aria-label="上一张照片">‹</button>
      <img class="lightbox-image" src="gallery-1-optimized.jpg" alt="相册照片预览" loading="lazy" decoding="async">
      <button class="lightbox-nav lightbox-next" type="button" aria-label="下一张照片">›</button>
    </div>
    <script src="app.js?v=20260813-scroll-scrub-v16"></script>
  </body>
</html>
